<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étalons Analytics — Burkina Faso</title>
<meta name="description" content="Analyse de données de l'équipe nationale senior du Burkina Faso : effectif, performances des joueurs depuis la CAN 2021, histoire, Elo et projections.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="star">★</span> Étalons Analytics</div>
    <nav>
      <a href="#effectif" data-i18n="nav_squad"></a>
      <a href="#joueurs" data-i18n="nav_pool"></a>
      <a href="#repartitions" data-i18n="nav_breakdowns"></a>
      <a href="#systemes" data-i18n="nav_forms"></a>
      <a href="#tempo" data-i18n="nav_tempo"></a>
      <a href="#importance" data-i18n="nav_imp"></a>
      <a href="#histoire" data-i18n="nav_history"></a>
      <a href="#elo" data-i18n="nav_elo"></a>
      <a href="#projections" data-i18n="nav_proj"></a>
      <a href="#methodo" data-i18n="nav_method"></a>
    </nav>
    <div class="lang">
      <button data-lang="fr">FR</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1><span aria-hidden="true">🇧🇫</span> Les Étalons — Burkina Faso</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <div class="tiles" id="tiles"></div>

  <section id="effectif">
    <h2 data-i18n="s_squad"></h2>
    <p class="lead" id="lead_squad"></p>
    <div class="grid">
      <div class="card" id="card_pos">
        <h3 data-i18n="c_pos"></h3>
        <p class="sub" data-i18n="c_pos_sub"></p>
        <div class="chart short" id="c_pos"></div>
      </div>
      <div class="card" id="card_age">
        <h3 data-i18n="c_age"></h3>
        <p class="sub" data-i18n="c_age_sub"></p>
        <div class="chart short" id="c_age"></div>
      </div>
      <div class="card w12">
        <h3 data-i18n="t_squad"></h3>
        <div class="tablewrap"><table id="squad_table"></table></div>
        <details class="tv"><summary data-i18n="t_callups"></summary>
          <div class="tablewrap"><table id="callups_table"></table></div>
        </details>
      </div>
    </div>
  </section>

  <section id="joueurs">
    <h2 data-i18n="s_pool"></h2>
    <p class="lead" data-i18n="s_pool_lead"></p>
    <div class="grid">
      <div class="card" id="card_minutes">
        <h3 data-i18n="c_minutes"></h3>
        <p class="sub" data-i18n="c_minutes_sub"></p>
        <div class="chart tall" id="c_minutes"></div>
      </div>
      <div class="card" id="card_goals">
        <h3 data-i18n="c_goals"></h3>
        <p class="sub" data-i18n="c_goals_sub"></p>
        <div class="chart tall" id="c_goals"></div>
      </div>
      <div class="card w12">
        <input type="search" id="pool_search" class="search">
        <div class="tablewrap pool"><table id="pool_table"></table></div>
        <p class="sub" id="pool_note"></p>
      </div>
      <div class="card w12" id="card_strip">
        <h3 data-i18n="c_strip"></h3>
        <p class="sub" data-i18n="c_strip_sub"></p>
        <div class="chart short" id="c_strip"></div>
      </div>
    </div>
  </section>

  <section id="importance">
    <h2 data-i18n="s_imp"></h2>
    <p class="lead" data-i18n="s_imp_lead"></p>
    <div class="grid">
      <div class="card w12" id="card_imp">
        <h3 data-i18n="c_imp_table"></h3>
        <p class="sub" data-i18n="c_imp_table_sub"></p>
        <p class="sub" id="pilier_note"></p>
        <div class="tablewrap"><table id="imp_table"></table></div>
      </div>
      <div class="card" id="card_prof">
        <h3 data-i18n="c_imp_prof"></h3>
        <p class="sub" data-i18n="c_imp_prof_sub"></p>
        <div class="pickrow"><label for="imp_picker" data-i18n="imp_picker"></label>
          <select id="imp_picker"></select></div>
        <div class="chart short" id="c_prof"></div>
      </div>
      <div class="card" id="card_bench">
        <h3 data-i18n="c_bench"></h3>
        <p class="sub" data-i18n="c_bench_sub"></p>
        <div class="chart short" id="c_bench"></div>
        <p class="sub" id="bench_note"></p>
      </div>
      <div class="card" id="card_captains">
        <h3 data-i18n="c_captains"></h3>
        <p class="sub" data-i18n="c_captains_sub"></p>
        <div class="tablewrap"><table id="captains_table"></table></div>
      </div>
      <div class="card" id="card_gk">
        <h3 data-i18n="c_gk"></h3>
        <p class="sub" data-i18n="c_gk_sub"></p>
        <div class="tablewrap"><table id="gk_table"></table></div>
      </div>
    </div>
  </section>

  <section id="repartitions">
    <h2 data-i18n="s_break"></h2>
    <p class="lead" data-i18n="s_break_lead"></p>
    <div class="grid">
      <div class="card" id="card_clubs">
        <h3 data-i18n="c_clubs"></h3>
        <p class="sub" data-i18n="c_clubs_sub"></p>
        <div class="chart tall" id="c_clubs"></div>
      </div>
      <div class="card" id="card_leagues">
        <h3 data-i18n="c_leagues"></h3>
        <p class="sub" data-i18n="c_leagues_sub"></p>
        <div class="league-bar" id="league_bar"></div>
        <div class="league-legend" id="league_legend"></div>
      </div>
    </div>
  </section>

  <section id="systemes">
    <h2 data-i18n="s_forms"></h2>
    <p class="lead" data-i18n="s_forms_lead"></p>
    <div class="grid">
      <div class="card w12" id="card_forms">
        <h3 data-i18n="c_forms"></h3>
        <p class="sub" data-i18n="c_forms_sub"></p>
        <div class="chart short" id="c_forms"></div>
      </div>
    </div>
  </section>

  <section id="tempo">
    <h2 data-i18n="s_tempo"></h2>
    <p class="lead" id="lead_tempo"></p>
    <div class="grid">
      <div class="card w8" id="card_bins">
        <h3 data-i18n="c_bins"></h3>
        <p class="sub" data-i18n="c_bins_sub"></p>
        <div class="chart" id="c_bins"></div>
        <p class="sub" id="chi_note"></p>
      </div>
      <div class="card w4" id="card_gamestate">
        <h3 data-i18n="c_gamestate"></h3>
        <p class="sub" data-i18n="c_gamestate_sub"></p>
        <div class="mini-tiles" id="tempo_tiles"></div>
        <div class="league-bar" id="state_bar"></div>
        <div class="league-legend" id="state_legend"></div>
      </div>
    </div>
  </section>

  <section id="histoire">
    <h2 id="title_history"></h2>
    <p class="lead" id="lead_history"></p>
    <div class="grid">
      <div class="card" id="card_decades">
        <h3 data-i18n="c_decades"></h3>
        <p class="sub" data-i18n="c_decades_sub"></p>
        <div class="chart short" id="c_decades"></div>
      </div>
      <div class="card">
        <h3 data-i18n="c_form"></h3>
        <p class="sub" data-i18n="c_form_sub"></p>
        <div class="chart short" id="c_form"></div>
      </div>
      <div class="card w12" id="card_afcon">
        <h3 data-i18n="c_afcon"></h3>
        <p class="sub" data-i18n="c_afcon_sub"></p>
        <div class="chart" id="c_afcon"></div>
      </div>
      <div class="card w4">
        <h3 data-i18n="t_capped"></h3>
        <div class="tablewrap"><table id="capped_table"></table></div>
      </div>
      <div class="card w4">
        <h3 data-i18n="t_scorers"></h3>
        <div class="tablewrap"><table id="scorers_table"></table></div>
      </div>
      <div class="card w4">
        <h3 data-i18n="t_last10"></h3>
        <div class="tablewrap"><table id="last10_table"></table></div>
      </div>
      <div class="card" id="card_shootouts">
        <h3 data-i18n="t_shootouts"></h3>
        <p class="sub" id="shootout_rec"></p>
        <div class="tablewrap"><table id="shootout_table"></table></div>
      </div>
      <div class="card" id="card_pens">
        <h3 data-i18n="t_pens"></h3>
        <p class="sub" data-i18n="t_pens_sub"></p>
        <div class="mini-tiles" id="pens_tiles"></div>
        <div class="tablewrap"><table id="takers_table"></table></div>
        <p class="sub" id="pens_gk_note"></p>
      </div>
      <div class="card w12" id="card_coaches">
        <h3 data-i18n="c_coaches"></h3>
        <p class="sub" data-i18n="c_coaches_sub"></p>
        <div class="tablewrap"><table id="coaches_table"></table></div>
      </div>
      <div class="card w12" id="card_venues">
        <h3 data-i18n="c_venues"></h3>
        <p class="sub" data-i18n="c_venues_sub"></p>
        <div class="chart short" id="c_venues"></div>
        <p class="sub" id="venues_note"></p>
      </div>
    </div>
  </section>

  <section id="elo">
    <h2 data-i18n="s_elo"></h2>
    <p class="lead" data-i18n="s_elo_lead"></p>
    <div class="grid">
      <div class="card w8" id="card_elo">
        <h3 data-i18n="c_elo_tl"></h3>
        <p class="sub" data-i18n="c_elo_tl_sub"></p>
        <div class="chart tall" id="c_elo_tl"></div>
      </div>
      <div class="card w4">
        <h3 data-i18n="c_winexp"></h3>
        <p class="sub" data-i18n="c_winexp_sub"></p>
        <div class="chart tall" id="c_winexp"></div>
        <p class="sub" id="winexp_note"></p>
      </div>
    </div>
  </section>

  <section id="projections">
    <h2 data-i18n="s_proj"></h2>
    <p class="lead" data-i18n="s_proj_lead"></p>
    <div class="grid">
      <div class="card w12" id="card_proj">
        <h3 data-i18n="c_proj_age"></h3>
        <p class="sub" data-i18n="c_proj_age_sub"></p>
        <div class="chart" id="c_proj_age"></div>
        <p class="core" id="core_box"></p>
        <p class="sub" id="readiness_note"></p>
      </div>
      <div class="card w12" id="card_pipeline">
        <h3 data-i18n="c_pipeline"></h3>
        <p class="sub" data-i18n="c_pipeline_sub"></p>
        <div class="tablewrap"><table id="pipeline_table"></table></div>
        <p class="sub" id="prospects_note"></p>
      </div>
    </div>
  </section>

  <section id="methodo">
    <h2 data-i18n="s_method"></h2>
    <div class="methodo" id="methodo"></div>
  </section>
</main>

<footer>
  <p id="footer_text"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
